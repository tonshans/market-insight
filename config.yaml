# =============================================================
# Market Tools - Konfigurasi Utama (FR-1)
# Nilai di sini adalah DEFAULT; CLI dapat meng-override per-run.
# =============================================================
version: "1.0.0"

exchange:
  id: indodax               # id ccxt
  quote_currency: IDR       # universe filter scanner (F3)
  enable_rate_limit: true   # hormati rate limiter ccxt
  request_sleep_ms: 200     # R-1: jeda antar fetch agar tidak kena rate limit

timeframes:
  default: [1h, 4h, 1d]     # TF utk confluence (F2)
  supported: [5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w]

analysis:
  ema_fast: 20              # regime EMA20/50 (F1)
  ema_slow: 50
  atr_period: 14
  adx_period: 14
  rsi_period: 14
  macd: { fast: 12, slow: 26, signal: 9 }
  lr_period: 20             # linear regression slope
  swing_lookback: 20        # utk S/R & invalidation
  min_atr_distance: 0.5     # FR-3: invalidation min jarak = 0.5 x ATR
  volume_avg_period: 20

cache:
  dir: cache
  ttl_minutes:
    5m: 5
    15m: 10
    30m: 20
    1h: 30
    2h: 60
    4h: 90
    6h: 120
    8h: 120
    12h: 180
    1d: 360                 # 6 jam
    3d: 720
    1w: 1440
  default_ttl_minutes: 30
  max_candles: 300          # panjang histori yg di-cache/di-fetch

circuit_breaker:            # FR-2 / D-4 / 5.1
  failure_threshold: 3      # 3 kegagalan berturut-turut dalam window
  failure_window_seconds: 60
  cooldown_seconds: 300     # pause semua fetch 5 menit

state:
  db_path: state/market_tools.db   # SQLite WAL (D-1, NFR-2)

logging:
  level: INFO
  dir: logs
